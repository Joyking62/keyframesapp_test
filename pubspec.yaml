name: keyframes_app
description: "Keyframes — IT services & creative design marketplace app (pre-order + chat)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Typography (downloads Google Fonts at runtime; can be bundled for offline)
  google_fonts: ^6.2.1

  # Onboarding page dots
  smooth_page_indicator: ^1.1.0

  # Date formatting in orders/chat
  intl: ^0.19.0

  # Firebase (Auth + Firestore). The app runs on mock data until you set
  # kUseFirebase = true in lib/core/app_config.dart and configure a project.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Optional: bundle your own fonts here for offline use.
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
